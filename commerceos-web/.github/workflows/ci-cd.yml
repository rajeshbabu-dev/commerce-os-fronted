name: CommerceOS Frontend CI/CD

on:
  push:
    branches:
      - main
      - stage
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - stage
      - develop

jobs:
  test-and-build:
    name: Test & Build SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Tests
        run: npx vitest run

      - name: Build Production SPA
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
          VITE_APP_ENV: production
        run: npm run build
